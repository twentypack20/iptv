name: Build IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "18 8 * * *"
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "supplemental_sources.json"
      - "epg_sources.json"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config.json"
      - "supplemental_sources.json"
      - "epg_sources.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/*.py

      - name: Build feed-aware iptv-org core playlist
        run: |
          python scripts/build_playlist_cached.py

      - name: Build full source inventory
        run: |
          python scripts/merge_supplemental.py

      - name: Build native EPG fingerprints for safe dedupe
        run: |
          python scripts/build_epg_index.py

      - name: Build external EPG bridge and enrich dedupe fingerprints
        run: |
          python scripts/build_epg_bridge.py

      - name: Select market-safe best streams
        run: |
          python scripts/smart_select.py

      - name: Guarantee unique final channel IDs
        run: |
          python scripts/ensure_unique_ids.py

      - name: Add TiviMate EPG URL to playlist header
        run: |
          python scripts/add_epg_header.py

      - name: Build combined XMLTV guide
        run: |
          python scripts/build_epg_tivimate.py

      - name: Validate generated outputs
        run: |
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          required = [
              Path('docs/core.m3u'),
              Path('docs/supplemental.m3u'),
              Path('docs/all-sources.m3u'),
              Path('docs/index.m3u'),
              Path('docs/epg.xml'),
              Path('docs/epg.xml.gz'),
              Path('docs/epg-bridge-report.json'),
              Path('docs/epg-report.json'),
              Path('docs/selection-report.json'),
              Path('docs/dedupe-candidates.json'),
          ]
          missing = [str(path) for path in required if not path.exists() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f'Missing/empty generated outputs: {missing}')

          index_text = Path('docs/index.m3u').read_text(encoding='utf-8')
          first_line = index_text.splitlines()[0] if index_text.splitlines() else ''
          if not first_line.startswith('#EXTM3U'):
              raise SystemExit('docs/index.m3u is not a valid M3U header')
          if 'https://twentypack20.github.io/iptv/epg.xml' not in first_line:
              raise SystemExit('docs/index.m3u is missing the TiviMate EPG URL in its header')

          extinf_lines = [line for line in index_text.splitlines() if line.startswith('#EXTINF:')]
          tvg_ids = []
          for line in extinf_lines:
              match = re.search(r'tvg-id="([^"]+)"', line)
              if not match:
                  raise SystemExit(f'Channel is missing tvg-id: {line[:200]}')
              tvg_ids.append(match.group(1))

          if len(set(tvg_ids)) != len(tvg_ids):
              raise SystemExit(
                  f'docs/index.m3u contains duplicate tvg-id values: '
                  f'{len(tvg_ids)} channels / {len(set(tvg_ids))} unique IDs'
              )

          epg_tree = ET.parse('docs/epg.xml')
          epg_channel_ids = [node.attrib.get('id', '') for node in epg_tree.getroot().findall('channel')]
          if len(epg_channel_ids) != len(extinf_lines):
              raise SystemExit(
                  f'EPG channel count does not match playlist: '
                  f'{len(epg_channel_ids)} EPG / {len(extinf_lines)} playlist'
              )
          if len(set(epg_channel_ids)) != len(epg_channel_ids):
              raise SystemExit('docs/epg.xml contains duplicate channel IDs')

          report = json.loads(Path('docs/selection-report.json').read_text(encoding='utf-8'))
          if report.get('published_channels', 0) < 100:
              raise SystemExit('Published channel count is unexpectedly low')
          if report.get('published_channels') != len(extinf_lines):
              raise SystemExit(
                  f'Selection report channel count mismatch: '
                  f'{report.get("published_channels")} report / {len(extinf_lines)} playlist'
              )

          epg_report = json.loads(Path('docs/epg-report.json').read_text(encoding='utf-8'))
          if epg_report.get('epg_channels') != len(extinf_lines):
              raise SystemExit('EPG report channel count does not match the playlist')

          print(
              f"Validated {len(extinf_lines)} published channels, "
              f"{len(tvg_ids)} unique tvg-id values, matching XMLTV channels, "
              f"and {epg_report.get('channels_with_programmes', 0)} channels with programmes"
          )
          PY

      - name: Commit generated files
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated IPTV playlists and EPG"
          file_pattern: "docs/**"

      - name: Show generated summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('docs/report.json'),
              Path('docs/supplemental-report.json'),
              Path('docs/epg-bridge-report.json'),
              Path('docs/selection-report.json'),
              Path('docs/epg-report.json'),
          ]:
              print(f'--- {path} ---')
              data = json.loads(path.read_text())
              if path.name == 'selection-report.json':
                  data.pop('collapsed_groups', None)
              if path.name == 'epg-report.json':
                  data.pop('selection_details', None)
              print(json.dumps(data, indent=2))
          PY
