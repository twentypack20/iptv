name: Build IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "18 8 * * *"
  push:
    branches:
      - main
    paths:
      - "config.json"
      - "supplemental_sources.json"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config.json"
      - "supplemental_sources.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Build feed-aware iptv-org core playlist
        run: |
          python scripts/build_playlist_expanded.py

      - name: Merge supplemental FAST and local-TV ecosystems
        run: |
          python scripts/merge_supplemental.py

      - name: Commit generated files
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated IPTV playlists"
          file_pattern: "docs/**"

      - name: Show generated summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('docs/report.json'), Path('docs/supplemental-report.json')]:
              print(f'--- {path} ---')
              print(path.read_text())
          PY
